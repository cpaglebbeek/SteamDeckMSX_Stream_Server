# SteamDeckMSX WebClient — snippet voor sites-enabled/horsecloud (:443 server-block)
# Doel-locatie HC55: /etc/nginx/snippets/steamdeckmsx-web.conf
# Include-regel: include /etc/nginx/snippets/steamdeckmsx-web.conf;
#
# Serveert /srv/steamweb/ (WebMSX cbios-build + eigen cartridge-dumps).
# Publiek open per user-besluit 2026-07-22; harm-reduction: noindex + geen listing.

location = /steam/ {
    auth_basic off;
    return 302 /steam/konami/;
}

location /steam/ {
    alias /srv/steamweb/;
    # Server-block heeft server-brede basic-auth ("HorseCloud") — hier bewust uit
    # per user-besluit 2026-07-22 (publiek open).
    auth_basic off;
    autoindex off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # wmsx.js is 1.5 MB — cache mag, versiebeheer via pad bij upgrade
    expires 1h;
}
